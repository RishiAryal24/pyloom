<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyLoom Conversation</title>
    <style>
      :root {
        color-scheme: light;
      }

      * { box-sizing: border-box; }

      body {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f4f7ff 0%, #eef6ff 100%);
        color: #132238;
      }

      #chat-container {
        width: min(92vw, 760px);
        height: min(86vh, 780px);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #dbe7ff;
        border-radius: 24px;
        box-shadow: 0 18px 60px rgba(20, 58, 110, 0.16);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        padding: 18px 22px;
        background: linear-gradient(90deg, #1f4ed8 0%, #2563eb 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-title {
        font-weight: 700;
        font-size: 1rem;
      }

      .chat-status {
        font-size: 0.85rem;
        opacity: 0.9;
      }

      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 18px 18px 8px;
        background: linear-gradient(180deg, #fbfdff 0%, #f7faff 100%);
      }

      .message-wrapper {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .label {
        font-size: 0.76rem;
        color: #64748b;
        margin: 0 6px 4px;
        font-weight: 600;
      }

      .message {
        padding: 12px 14px;
        border-radius: 16px;
        max-width: 84%;
        line-height: 1.45;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .user {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 6px;
      }

      .bot {
        background: white;
        color: #1f2937;
        align-self: flex-start;
        border-bottom-left-radius: 6px;
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 18px 12px;
      }

      .suggestion-chip {
        border: 1px solid #cfe0ff;
        background: #f7faff;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #1d4ed8;
      }

      .suggestion-chip:hover {
        background: #eaf2ff;
      }

      #input-container {
        display: flex;
        gap: 8px;
        padding: 14px 16px 16px;
        border-top: 1px solid #e5ecf8;
        background: white;
      }

      #input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #d7e4ff;
        border-radius: 999px;
        outline: none;
        font-size: 0.96rem;
      }

      #input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      #send,
      #reset {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
      }

      #send {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: white;
      }

      #reset {
        background: #eef2ff;
        color: #334155;
      }

      #send:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .typing {
        display: inline-block;
        padding: 0 2px;
      }

      .typing span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 1px;
        background: #9ca3af;
        border-radius: 50%;
        animation: bounce 1.2s infinite ease-in-out;
      }

      .typing span:nth-child(2) { animation-delay: 0.15s; }
      .typing span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.55; }
        40% { transform: translateY(-4px); opacity: 1; }
      }

      @media (max-width: 640px) {
        #chat-container { height: 100vh; border-radius: 0; width: 100%; }
        .chat-header { padding: 16px; }
        #input-container { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div class="chat-header">
        <div>
          <div class="chat-title">AI-Solution Assistant</div>
          <div class="chat-status">Helpful, concise, and grounded in our latest company information</div>
        </div>
      </div>
      <div id="chat-box"></div>
      <div class="suggestions">
        <button class="suggestion-chip" data-prompt="What services do you offer?">What services do you offer?</button>
        <button class="suggestion-chip" data-prompt="How can I contact AI-Solution?">How can I contact AI-Solution?</button>
        <button class="suggestion-chip" data-prompt="Tell me about your recent projects">Tell me about your recent projects</button>
      </div>
      <div id="input-container">
        <input type="text" id="input" placeholder="Ask about services, contact details, projects, or events..." />
        <button id="send">Send</button>
        <button id="reset">Reset</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const resetBtn = document.getElementById("reset");
      const suggestionChips = document.querySelectorAll(".suggestion-chip");
      const chatAgentNames = ["Ritika", "Upasana", "Ritik", "Aayush", "Sneha"];
      let chatAgentName = localStorage.getItem("pyloomChatAgent");

      if (!chatAgentName) {
        chatAgentName = chatAgentNames[Math.floor(Math.random() * chatAgentNames.length)];
        localStorage.setItem("pyloomChatAgent", chatAgentName);
      }

      function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function addMessage(message, sender) {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper";

        const label = document.createElement("div");
        label.className = "label";

        const msg = document.createElement("div");
        msg.className = "message " + sender;

        if (sender === "user") {
          label.innerText = "You";
          msg.innerText = message;
        } else {
          label.innerText = chatAgentName;
          typeMessage(msg, message);
        }

        wrapper.appendChild(label);
        wrapper.appendChild(msg);
        chatBox.appendChild(wrapper);
        scrollToBottom();
      }

      function showTypingIndicator() {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper";
        const label = document.createElement("div");
        label.className = "label";
        label.innerText = chatAgentName;
        const msg = document.createElement("div");
        msg.className = "message bot";
        msg.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
        wrapper.appendChild(label);
        wrapper.appendChild(msg);
        chatBox.appendChild(wrapper);
        return msg;
      }

      function typeMessage(element, text, i = 0) {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          setTimeout(() => typeMessage(element, text, i + 1), 16);
        } else {
          scrollToBottom();
        }
      }

      async function sendMessage() {
        const query = input.value.trim();
        if (!query) return;

        addMessage(query, "user");
        input.value = "";
        sendBtn.disabled = true;

        const typingBubble = showTypingIndicator();

        try {
          const response = await fetch("{% url 'core:chatbot_proxy' %}", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify({ query, agent_name: chatAgentName }),
          });

          const data = await response.json();
          typingBubble.remove();
          addMessage(data.response, "bot");
        } catch (err) {
          typingBubble.remove();
          addMessage("I’m having trouble reaching the service right now. Please try again in a moment.", "bot");
        } finally {
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      suggestionChips.forEach((chip) => {
        chip.addEventListener("click", () => {
          input.value = chip.dataset.prompt;
          input.focus();
        });
      });

      resetBtn.addEventListener("click", async () => {
        chatBox.innerHTML = "";
        await fetch("{% url 'core:chatbot_reset' %}", {
          method: "POST",
          headers: { "X-CSRFToken": "{{ csrf_token }}" },
        });
        const greeting = `Hi, this is ${chatAgentName} from PyLoom. How can I help you today?`;
        addMessage(greeting, "bot");
      });

      window.onload = () => {
        const naturalGreeting = `Hi, this is ${chatAgentName} from PyLoom. How can I help you today?`;
        addMessage(naturalGreeting, "bot");
      };
    </script>
  </body>
</html>
